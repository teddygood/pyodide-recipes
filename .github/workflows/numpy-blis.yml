name: NumPy BLIS experiment

on:
  pull_request:
    paths:
      - tools/numpy-blis/**
      - .github/workflows/numpy-blis.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [noblas, reference, simd, openblas, openblas-dev]
    env:
      PYODIDE_XBUILDENV_PATH: ${{ github.workspace }}/.numpy-blis/xbuildenv
      PYODIDE_JOBS: 3
      PIP_CONSTRAINT: ${{ github.workspace }}/tools/constraints.txt
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.0-rc.1'
          allow-prereleases: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prepare the build environment
        run: |
          python -m pip install 'pyodide-build @ git+https://github.com/pyodide/pyodide-build.git@c716be86261c539431ce54db6b1a3bd6c1846fc6'
          pyodide xbuildenv install 315.0.0a2
          pyodide xbuildenv install-emscripten --version 6.0.5
      - name: Build and verify NumPy
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          NODE_DIR=$(dirname "$(command -v node)")
          source "$(pyodide config get emsdk_dir)/emsdk_env.sh"
          export PATH="$NODE_DIR:$PATH"
          bash tools/numpy-blis/build.sh ".numpy-blis/$VARIANT" "$VARIANT"
          node tools/numpy-blis/verify.mjs ".numpy-blis/$VARIANT"
      - name: Verify NumPy in Chromium
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          python tools/numpy-blis/run_browser.py --verify --variants "$VARIANT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: numpy-${{ matrix.variant }}
          path: |
            .numpy-blis/${{ matrix.variant }}/verification.json
            .numpy-blis/${{ matrix.variant }}/artifacts.json
            .numpy-blis/${{ matrix.variant }}/logs/
            .numpy-blis/browser/verify-${{ matrix.variant }}.json
