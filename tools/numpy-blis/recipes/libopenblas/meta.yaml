package:
  name: libopenblas
  version: 0.3.34
source:
  url: https://github.com/OpenMathLib/OpenBLAS/archive/refs/tags/v0.3.34.tar.gz
  sha256: cd7e129868320cc2d033afa920e31202dfe0b8066a5b66661900ccc0f197dfed
build:
  type: shared_library
  script: |
    emmake make libs -j ${PYODIDE_JOBS:-3} \
      CC=emcc HOSTCC=gcc AR=emar RANLIB=emranlib \
      BINARY=32 TARGET=WASM128_GENERIC USE_THREAD=0 \
      NOFORTRAN=1 NO_LAPACK=1 NO_LAPACKE=1 NO_SHARED=1
    emmake make install PREFIX=${WASM_LIBRARY_DIR} \
      CC=emcc HOSTCC=gcc AR=emar RANLIB=emranlib \
      BINARY=32 TARGET=WASM128_GENERIC USE_THREAD=0 \
      NOFORTRAN=1 NO_LAPACK=1 NO_LAPACKE=1 NO_SHARED=1
    cp ${WASM_LIBRARY_DIR}/lib/pkgconfig/openblas.pc \
      ${WASM_LIBRARY_DIR}/lib/pkgconfig/openblas-experiment.pc
    mkdir -p dist
    emcc ${WASM_LIBRARY_DIR}/lib/libopenblas.a \
      ${SIDE_MODULE_LDFLAGS} -msimd128 -o dist/libopenblas.so
    cp dist/libopenblas.so ${WASM_LIBRARY_DIR}/lib/libopenblas.so
about:
  home: https://github.com/OpenMathLib/OpenBLAS
  license: BSD-3-Clause
  summary: OpenBLAS portable WASM SIMD without LAPACK
